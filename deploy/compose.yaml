services:
  admin:
    image: ${ADMIN_IMAGE:?Configura ADMIN_IMAGE}
    restart: unless-stopped
    env_file: admin.env
    ports:
      - "127.0.0.1:${ADMIN_PORT:?Configura ADMIN_PORT}:3001"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
