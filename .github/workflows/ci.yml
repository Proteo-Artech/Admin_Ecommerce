name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  merge_group:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Producción recibe exclusivamente develop del mismo repositorio
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: test "$HEAD_BRANCH" = develop && test "$HEAD_REPO" = "$BASE_REPO"
      - name: Verificar despliegue del commit en develop
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: node scripts/verify-promotion.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:../data/ci-build.db
      ALLOW_DEMO_SEED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t admin-ci .
  deploy:
    permissions:
      contents: read
      packages: write
    needs: [branch-policy, quality]
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/vps-deploy.yml
    secrets: inherit
